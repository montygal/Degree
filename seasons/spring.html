<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            background-image: url('../images/sakura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            /* <-- Required to make the page full height */
            margin: 0;
        }
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring</title>
    <link rel="stylesheet" href="../styles/spring.css">
</head>

<body>
    <!-- Back Button -->
    <a href="../index.html" class="back-home-btn">&larr; Back</a>
    <div class="stitch">
        <!-- Home link on the RIGHT -->
        <a href="/" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <div class="spring">
        <figure>
            <a href="../patterns/moth.html">
                <img src="../images/Africa.jpg" alt="A picture of Africa in the Spring with a moth" width="400"
                    height="300" />
            </a>
            <figcaption>African Moth</figcaption>
        </figure>
        <figure>
            <a href="../patterns/lemur.html">
                <img src="../images/Africa2.jpg" alt="A picture of Africa in the Spring with a lemur" width="400"
                    height="300" />
            </a>
            <figcaption>African Lemur</figcaption>
        </figure>
    </div>
    <!-- Date & Time Display -->
    <div id="datetime"></div>
    <!-- Single Floating Cart Button in Bottom-Right Corner -->
    <a href="../contact/checkout.html" class="floating-cart" title="View Cart">
        <img src="../images/shopping.png" alt="Shopping Cart">
        <span class="cart-badge" id="cart-badge">0</span>
    </a>
    <!-- Cleaned Combined Script -->
    <script>
        // 1. Live Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formatted = now.toLocaleDateString('en-US', options);
            const dateElem = document.getElementById('datetime');
            if (dateElem) {
                dateElem.textContent = formatted;
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
        // 2. Shopping Cart Counter (reads saved count on page load)
        let count = parseInt(localStorage.getItem('cartItemCount')) || 0;
        const badge = document.getElementById('cart-badge');
        if (badge) {
            badge.textContent = count;
        }
        function addToCart() {
            count++;

            // Update badge on screen
            if (badge) {
                badge.textContent = count;
            }
            // Save to browser memory
            localStorage.setItem('cartItemCount', count);

            alert("Item added to cart! Total items: " + count);
        }
    </script>
</body>

</html>
