<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            background-image: url('../images/sakura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            /* <-- Required to make the page full height */
            margin: 0;
        }

        .summer img {
            border: 8px solid rgba(35, 184, 147, 0.918);
            outline: 3px solid #ffffff;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer</title>
    <link rel="stylesheet" href="../styles/summer.css">
</head>

<body>
    <!-- Back Button -->
    <a href="../index.html" class="back-home-btn">&larr; Back</a>
    <div class="stitch">
        <!-- Home link on the RIGHT -->
        <a href="/" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <div class="summer">
        <figure>
            <a href="../patterns/beach.html">
                <img src="../images/Oregon.jpg" alt="A picture of the Oregon coast" width="400" height="300" />
            </a>
            <figcaption>Oregon Coast</figcaption>
            <figcaption>$12.00</figcaption>
        </figure>
        <figure>
            <a href="../patterns/coast.html">
                <img src="../images/Oregon2.jpg" alt="A picture of sea lions in a cave" width="400" height="300" />
            </a>
            <figcaption>Oregon Cave</figcaption>
            <figcaption>$15.00</figcaption>
        </figure>

        <figure>
            <a href="../patterns/waves.html">
                <img src="../images/Oregon3.jpg" alt="A picture of a waves crashing on the coast" width="400"
                    height="300" />
            </a>
            <figcaption>Rocky Shore</figcaption>
            <figcaption>$20.00</figcaption>
        </figure>
        <figure>
            <a href="../patterns/lighthouse.html">
                <img src="../images/Oregon4.jpg" alt="A picture of a lighthouse on the coast" width="400"
                    height="300" />
            </a>
            <figcaption>Lighthouse</figcaption>
            <figcaption>$25.00 </figcaption>
        </figure>


    </div>
    <!-- Pinned Log Out & Date/Time Container -->
    <div class="bottom-datetime-container">
        <a href="../setup/logout.html" class="floating-logout">Log Out</a>
        <div id="datetime"></div>
    </div>
    <!-- Single Floating Cart Button in Bottom-Right Corner -->
    <a href="../contact/checkout.html" class="floating-cart" title="View Cart">
        <img src="../images/shopping.png" alt="Shopping Cart">
        <span class="cart-badge" id="cart-badge">0</span>
    </a>
    <!--Footer-->
    <footer>
        <div class="footer">
            &copy Sariah Tanner 2026</div>
    </footer>
    <!-- Cleaned Combined Script -->
    <script>
        // 1. Live Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formatted = now.toLocaleDateString('en-US', options);
            const dateElem = document.getElementById('datetime');
            if (dateElem) {
                dateElem.textContent = formatted;
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
        // 2. Shopping Cart Counter (reads saved count on page load)
        let count = parseInt(localStorage.getItem('cartItemCount')) || 0;
        const badge = document.getElementById('cart-badge');
        if (badge) {
            badge.textContent = count;
        }
        function addToCart() {
            count++;

            // Update badge on screen
            if (badge) {
                badge.textContent = count;
            }
            // Save to browser memory
            localStorage.setItem('cartItemCount', count);
        }

    </script>
</body>

</html>
