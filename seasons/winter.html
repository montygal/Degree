    <!-- Cleaned Combined Script -->
    <script>
        // 1. Live Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formatted = now.toLocaleDateString('en-US', options);
            const dateElem = document.getElementById('datetime');
            if (dateElem) {
                dateElem.textContent = formatted;
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
        // 2. Shopping Cart Counter (reads saved count on page load)
        function updateBadge() {
            const cart = JSON.parse(localStorage.getItem('stitchCart')) || [];
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.textContent = cart.length;
            }
        }
        updateBadge();
        // 3. Log Out Handler
        function handleLogout(event) {
            event.preventDefault();
            localStorage.removeItem('loggedInUser');
            alert("You have logged out.");
            window.location.reload(); // Refreshes page as logged out
        }

    </script>
