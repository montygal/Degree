       <div id="datetime"></div>
<script>
  function updateDateTime() {
    const now = new Date();
    // Format options (e.g., "Thursday, September 24, 2026, 9:30:15 PM")
    const options = {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    };
    const formatted = now.toLocaleDateString('en-US', options);
    document.getElementById('datetime').textContent = formatted;
  }
  // Update immediately, then every 1 second
  updateDateTime();
  setInterval(updateDateTime, 1000);
</script>
