<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            background-image: url('images/sakura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            /* <-- Required to make the page full height */
            margin: 0;
        }
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main..css">
    <!--Above is linked to main CSS page in the styles folder-->
    <title>Stitch and Bloom</title>
</head>

<body>
    <div class="stitch">
        <!-- Right-side container with Home & Account links -->
        <div class="home-container">
            <a href="../index.html" class="home-link">Home</a>
            <div class="auth-links">
                <a href="setup/signup.html" class="signup">Sign Up</a>
                <a href="setup/login.html" class="login">Log In</a>
            </div>
        </div>

        <!-- Dropdown button on the LEFT -->
        <div class="dropdown">
            <button class="dropbtn">Cross-Stitches</button>
            <div class="dropdown-content">
                <a href="seasons/spring.html">Spring</a>
                <a href="seasons/summer.html">Summer</a>
                <a href="seasons/fall.html">Fall</a>
                <a href="seasons/winter.html">Winter</a>
            </div>
        </div>
        <!-- Home link on the RIGHT -->
        <a href="/" class="home-link">Home</a>
        <!-- Title stays centered in the middle -->
        <h1 class="author-name">STITCH AND BLOOM<img src="images/needle.jpg" alt="a picture of a needle and thread"
                width="100px" height="100px" />
        </h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>


    <div class="image-grid">
        <a href="seasons/spring.html">
            <img src="images/Spring.jpg" alt="A picture of Sakura trees in the Spring" />
            <p><i>Spring</i></p>
        </a>
        <a href="seasons/summer.html">
            <img src="images/Summer.jpg" alt="A picture of the beach in the summer" />
            <p><i>Summer</i></p>
        </a>
        <a href="seasons/fall.html">
            <img src="images/Fall.jpg" alt="A picture of trees turning colors in the fall">
            <p><i>Fall</i></p>
        </a>
        <a href="seasons/winter.html">
            <img src="images/Winter.jpg" alt="A picture of trees in the snow">
            <p><i>Winter</i></p>
        </a>
    </div>
 <!-- Pinned Log Out & Date/Time Container -->
<div class="bottom-datetime-container">
   <a href="setup/logout.html" class="floating-logout">Log Out</a>
   <div id="datetime"></div>
</div>

  
    <!-- Single Floating Cart Button in Bottom-Right Corner -->
    <a href="contact/checkout.html" class="floating-cart" title="View Cart">
        <img src="../images/shopping.png" alt="Shopping Cart">
        <span class="cart-badge" id="cart-badge">0</span>
    </a>
    <!-- Cleaned Combined Script -->
    <script>
        // 1. Live Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formatted = now.toLocaleDateString('en-US', options);
            const dateElem = document.getElementById('datetime');
            if (dateElem) {
                dateElem.textContent = formatted;
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
        // 2. Shopping Cart Counter (reads saved count on page load)
        let count = parseInt(localStorage.getItem('cartItemCount')) || 0;
        const badge = document.getElementById('cart-badge');
        if (badge) {
            badge.textContent = count;
        }
        function addToCart() {
            count++;

            // Update badge on screen
            if (badge) {
                badge.textContent = count;
            }
            // Save to browser memory
            localStorage.setItem('cartItemCount', count);
        }
    </script>

</body>

</html>
