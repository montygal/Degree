<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            background-image: url('../images/sakura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            /* <-- Required to make the page full height */
            margin: 0;
        }
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glacier</title>
    <link rel="stylesheet" href="../styles/glacier.css">
</head>

<body>
    <!-- Back Button in Top-Left -->
    <a href="javascript:history.back()" class="back-btn">&larr; Back</a>
    <div class="stitch">
        <!-- Home link on the RIGHT -->
        <a href="/" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <div class="glacier">
        <img src="../images/Norway.jpg" alt="A picture of a glacier in Norway" width="400" height="300">
        <p>A stunning glacier in Norway, perfect for showcasing the beauty of nature. People travel from all over the
            world to see this magnificent sight.
            Turn this breathtaking view into a cross stitch pattern to bring a piece of Norway into your home.</p>
   <button type="button" class="add-to-cart-btn"
            onclick="addToCart('Glacier Pattern', 23.00, '../images/Norway.jpg')">
            Add to Cart $23.00
        </button>
    </div>
    <!-- Date & Time Display -->
    <div id="datetime"></div>
    <!-- Single Floating Cart Button in Bottom-Right Corner -->
    <a href="../contact/checkout.html" class="floating-cart" title="View Cart">
        <img src="../images/shopping.png" alt="Shopping Cart">
        <span class="cart-badge" id="cart-badge">0</span>
    </a>
    <!-- Combined Scripts -->
    <script>
        // 1. Live Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formatted = now.toLocaleDateString('en-US', options);
            const dateElem = document.getElementById('datetime');
            if (dateElem) {
                dateElem.textContent = formatted;
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
        // 2. Shopping Cart Functions
        function updateBadge() {
            const cart = JSON.parse(localStorage.getItem('stitchCart')) || [];
            const badge = document.getElementById('cart-badge');
            if (badge) {
                badge.textContent = cart.length;
            }
        }
        function addToCart(title, price, image) {
            // 1. Get existing cart or start empty
            let cart = JSON.parse(localStorage.getItem('stitchCart')) || [];
            // 2. Add item details
            cart.push({ title: title, price: price, image: image });
            // 3. Save to browser memory
            localStorage.setItem('stitchCart', JSON.stringify(cart));
            // 4. Update badge
            updateBadge();
         
        }
        // Run once on page load to display initial count
        updateBadge();
    </script>
</body>

</html>
