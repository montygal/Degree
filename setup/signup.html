<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Stitch and Bloom</title>
    <link rel="stylesheet" href="../styles/signup.css">
</head>

<body>
    <!-- Top Green Header -->
    <div class="stitch">
        <!-- Links back to main home page -->
        <a href="../index.html" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <!-- Sign-Up Box -->
    <div class="signup-card">
        <div id="signup-section">
            <h2>Create an Account</h2>
            <p>Choose a username and password to create your account!</p>
            <form id="signup-form">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="new-username">Username:</label>
                    <input type="text" id="new-username" placeholder="Choose a username" required>
                </div>
                <!-- Password Field -->
                <div class="form-group">
                    <label for="new-password">Password:</label>
                    <input type="password" id="new-password" placeholder="Create a password" required>
                    <!-- Error message text appears here -->
                    <p id="password-error" class="error-msg"></p>
                </div>


                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
        <!-- Success Confirmation (Appears after clicking Create Account) -->
        <div id="confirmation-section" class="confirmation-box">
            <h3>🎉 Account Created!</h3>
            <p>Welcome, <b id="display-username"></b>! Your account has been created successfully.</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <a href="login.html" class="home-link" style="position: static;">Log In Now</a>
                <a href="../index.html" class="home-link" style="position: static;">Return Home</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('signup-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const username = document.getElementById('new-username').value.trim();
            const passwordInput = document.getElementById('new-password');
            const password = passwordInput.value;
            const errorText = document.getElementById('password-error');
            // 1. Reset error state each time the user submits
            errorText.style.display = 'none';
            passwordInput.classList.remove('input-error');
            // 2. Validate password
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!passwordRegex.test(password)) {
                // Display the error message and highlight the input red
                errorText.textContent = "Must be at least 8 characters with at least 1 uppercase letter and 1 number.";
                errorText.style.display = 'block';
                passwordInput.classList.add('input-error');
                passwordInput.focus();
                return; // Stops here, will not create account
            }
            // 3. Save account credentials if valid
            localStorage.setItem('stitchAccount', JSON.stringify({ username: username, password: password }));
            // 4. Hide form and show success confirmation
            document.getElementById('signup-section').style.display = 'none';
            document.getElementById('display-username').textContent = username;
            document.getElementById('confirmation-section').style.display = 'block';
        });
        // Optional: Clear the error automatically as soon as the user starts typing again
        document.getElementById('new-password').addEventListener('input', function () {
            document.getElementById('password-error').style.display = 'none';
            this.classList.remove('input-error');
        });

    </script>
</body>

</html>
