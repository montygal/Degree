<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Stitch and Bloom</title>
    <!-- Linked to your separate CSS file -->
    <link rel="stylesheet" href=..styles/welcome.css">
</head>
<body>
    <!-- Top Green Header -->
    <div class="stitch">
        <!-- Log Out & Home buttons on the RIGHT -->
        <div class="top-nav-right">
            <a href="logout.html" class="home-link">Log Out</a>
            <a href="../index.html" class="home-link">Home</a>
        </div>
        <!-- Centered Title with needle image -->
        <h1 class="author-name">
            STITCH AND BLOOM
        </h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
   <!-- Cleaned Combined Script -->
    <script>
        // 1. Live Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const formatted = now.toLocaleDateString('en-US', options);
            const dateElem = document.getElementById('datetime');
            if (dateElem) {
                dateElem.textContent = formatted;
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
        // 2. Shopping Cart Counter (reads saved count on page load)
        let count = parseInt(localStorage.getItem('cartItemCount')) || 0;
        const badge = document.getElementById('cart-badge');
        if (badge) {
            badge.textContent = count;
        }
        function addToCart() {
            count++;

            // Update badge on screen
            if (badge) {
                badge.textContent = count;
            }
            // Save to browser memory
            localStorage.setItem('cartItemCount', count);
        }
        // 3. Log Out Handler
        function handleLogout(event) {
            event.preventDefault();
            localStorage.removeItem('loggedInUser');
            alert("You have logged out.");
            window.location.reload(); // Refreshes page as logged out
        }

    </script>
</body>
