<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Stitch and Bloom</title>
    <link rel="stylesheet" href="../styles/signup.css">
</head>
<body>
    <!-- Top Green Header -->
    <div class="stitch">
        <a href="../index.html" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <!-- Thank You Card -->
    <div class="signup-card logout-card">
        <h2>🌸 Logged Out</h2>
        <!-- Personalized message -->
        <p>Thank you for visiting, <b id="logout-username">friend</b>. Come again soon!</p>
        <div class="btn-group">
            <a href="login.html" class="home-link">Log In Again</a>
            <a href="../index.html" class="home-link">Return to Shop</a>
        </div>
    </div>
    <script>
        // 1. Get the username stored during signup/login
        let username = "friend";
        const savedAccount = localStorage.getItem('stitchAccount');
        if (savedAccount) {
            const account = JSON.parse(savedAccount);
            if (account.username) {
                username = account.username;
            }
        }
        // Check if you use a 'currentUser' key for the active user
        if (localStorage.getItem('currentUser')) {
            username = localStorage.getItem('currentUser');
        }
        // 2. Put the username into the text
        document.getElementById('logout-username').textContent = username;
        // 3. Clear the active session
        localStorage.removeItem('currentUser');
        sessionStorage.clear();
    </script>
</body>
</html>
