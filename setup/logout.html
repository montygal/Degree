<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Stitch and Bloom</title>
    <link rel="stylesheet" href="../styles/signup.css">
    <link rel="stylesheet" href="../styles/logout.css">
</head>
<body>
    <!-- Top Green Header -->
    <div class="stitch">
        <a href="../index.html" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
     <!-- Thank You Card -->
    <div class="signup-card logout-card">
        <h2 id="logout-title">🌸 Logged Out</h2>
        <p id="logout-message">Thank you for visiting, <b id="logout-username">friend</b>. Come again soon!</p>
        <div class="btn-group">
            <a href="login.html" class="home-link">Log In</a>
            <a href="../index.html" class="home-link">Return to Shop</a>
        </div>
    </div>
     <script>
        // Check if there is an active logged-in user
        const user = localStorage.getItem('loggedInUser');
        const titleElem = document.getElementById('logout-title');
        const messageElem = document.getElementById('logout-message');
        if (user) {
            // 1. If someone IS logged in: show the thank you message
            titleElem.textContent = "🌸 Logged Out";
            messageElem.innerHTML = `Thank you for visiting, <b>${user}</b>. Come again soon!`;
            
            // Clear their login session
            localStorage.removeItem('loggedInUser');
            sessionStorage.clear();

            // Empty the cart
            localStorage.removeItem('stitchCart');
            localStorage.removeItem('cartItemCount');
        } else {
            // 2. If NO ONE is logged in: show the warning message
            titleElem.textContent = "⚠️ Not Logged In";
            messageElem.textContent = "You are not logged in.";
        }
    </script>

  
</body>
</html>
