<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-image: url('../images/sakura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .confirmation-card {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .confirmation-card h2 {
            color: #2e7d32;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .confirmation-card p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 16px 0 28px 0;
        }
        /* Buttons */
        .btn-home {
            display: inline-block;
            background-color: #46e9c5;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .btn-home:hover {
            background-color: #38c4a4;
        }
        .btn-download {
            display: inline-block;
            background-color: #ff9e99;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .btn-download:hover {
            background-color: #f78680;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Stitch and Bloom</title>
    <link rel="stylesheet" href="../styles/checkout.css">
</head>
<body>
    <!-- Header banner -->
    <div class="stitch">
        <a href="../index.html" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <!-- Confirmation Card -->
    <div class="confirmation-card">
        <h2>🎉 Thank you for your order, <span id="first-name"></span>!</h2>
        <p>Your order has been received and is being prepared. We appreciate your support of Stitch and Bloom!</p>
        
        <!-- Purchased Pattern Downloads Container -->
        <div id="downloads-list" style="margin-bottom: 20px;"></div>
        
        <a href="../index.html" class="btn-home">Return to Home</a>
    </div>
    <script>
        // 1. Display customer name from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "there";
        document.getElementById('first-name').textContent = name;
        // 2. Render download buttons for purchased patterns
        const purchased = JSON.parse(localStorage.getItem('purchasedItems')) || [];
        const downloadsContainer = document.getElementById('downloads-list');
        if (purchased.length > 0) {
            downloadsContainer.innerHTML = '<h3>Your Downloads:</h3>' + purchased.map(item => {
                // Converts image path (e.g., ../images/Oregon.jpg) to PDF path (../pdfs/Oregon.pdf)
                const pdfPath = item.image.replace('/images/', '/pdfs/').replace(/\.(jpg|jpeg|png)$/i, '.pdf');
                return `
                    <div style="margin: 10px 0;">
                        <a href="${pdfPath}" download class="btn-download">
                            📥 Download ${item.title} (PDF)
                        </a>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
