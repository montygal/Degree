<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-image: url('../images/sakura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .confirmation-card {
            max-width: 500px;
            margin: 60px auto;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .confirmation-card h2 {
            color: #2e7d32;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .confirmation-card p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 16px 0 28px 0;
        }
        .btn-home {
            display: inline-block;
            background-color: #46e9c5;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover {
            background-color: #38c4a4;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Stitch and Bloom</title>
    <link rel="stylesheet" href="../styles/checkout.css">
</head>
<body>
    <!-- Header banner -->
    <div class="stitch">
        <a href="../index.html" class="home-link">Home</a>
        <h1>STITCH AND BLOOM</h1>
        <h3>BY:</h3>
        <h2><i>Sariah Tanner</i></h2>
    </div>
    <!-- Thank You Confirmation Box -->
    <div class="confirmation-card">
        <h2>🎉 Thank you for your order, <span id="first-name"></span>!</h2>
        <p>Your order has been received and is being prepared. We appreciate your support of Stitch and Bloom!</p>
        <a href="../index.html" class="btn-home">Return to Home</a>
    </div>
    <!-- Script to extract the name from the URL and display it -->
    <script>
        // 1. Read the "?name=..." from the page URL
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "there";
        // 2. Put the name into the <span> tag
        document.getElementById('first-name').textContent = name;
    </script>
</body>
</html>
